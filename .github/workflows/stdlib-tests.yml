name: stdlib tests

# Fast, dependency-free check: runs the standard-library `unittest` suite for
# the boto3-free core (token usage, capability lookup, guardrail helpers,
# error hierarchy) without installing boto3, botocore, pytest, or the package
# itself. Complements the coverage-gated `test` workflow (uv + pytest).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stdlib:
    name: stdlib unittest (no third-party deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources and tests
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run standard-library unittest suite
        run: python -m unittest discover -s tests/stdlib -t tests/stdlib -v

[project]
name = "bedrock-ops"
version = "0.1.0"
description = "Production-grade boto3 toolkit for AWS Bedrock: typed retry, per-model timeouts, capability lookup, full token usage with cache fields, PII-safe Guardrails."
readme = "README.md"
authors = [
    { name = "Mukunda Katta", email = "mukunda.vjcs6@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["aws", "bedrock", "boto3", "llm", "production", "retry", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "boto3>=1.35.0",
    "botocore>=1.35.0",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/bedrock-ops"
Source = "https://github.com/MukundaKatta/bedrock-ops"
Issues = "https://github.com/MukundaKatta/bedrock-ops/issues"
Changelog = "https://github.com/MukundaKatta/bedrock-ops/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
